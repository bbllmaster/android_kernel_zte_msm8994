name: kernel

on:
  workflow_dispatch:
  push:
    branches: [lineage-22.2]
    paths:
      - '.github/workflows/kernel.yml'
      - 'scripts/**'
      - 'README.md'
      - 'PORTING.md'

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "before:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          echo "after:"
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential curl flex git libelf-dev libssl-dev \
            python3 rsync xz-utils

      - name: Fetch ZTE A2015 kernel source
        run: |
          curl -L --fail --retry 3 -o /tmp/zte-kernel.tar.gz \
            'https://download.ztedevices.com/device/global/support/opensource/2/1297/ZTE_A2015_Marshmallow_Kernel(3.10.84).tar.gz'
          echo '1952ab52f5ef3015c734cf8ef9fc48b3  /tmp/zte-kernel.tar.gz' | md5sum -c -
          ./scripts/import-zte-kernel.sh /tmp/zte-kernel.tar.gz
          test -f Makefile
          grep -m1 '^SUBLEVEL' Makefile

      - name: Fetch AOSP GCC 4.9 (aarch64)
        run: |
          git clone --depth 1 -b cm-14.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            /tmp/gcc49
          /tmp/gcc49/bin/aarch64-linux-android-gcc --version | head -1

      - name: Build kernel
        shell: bash
        run: |
          set -o pipefail
          export ARCH=arm64
          export CROSS_COMPILE=/tmp/gcc49/bin/aarch64-linux-android-
          make O=out msm8994_defconfig 2>&1 | tee build.log
          make O=out -j"$(nproc)" 2>&1 | tee -a build.log

      - name: List outputs
        if: always()
        run: |
          find out/arch/arm64/boot -maxdepth 4 -type f \
            \( -name 'Image*' -o -name '*.dtb' \) -printf '%s %p\n' | sort -nr | head -50

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2015-kernel-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dts/**/*.dtb
            out/System.map
            build.log
