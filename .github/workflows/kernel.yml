name: kernel

on:
  workflow_dispatch:
  push:
    branches: [lineage-22.2]
    paths:
      - '.github/workflows/kernel.yml'
      - 'scripts/**'
      - 'README.md'
      - 'PORTING.md'

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "before:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          echo "after:"
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential curl flex git libelf-dev libssl-dev \
            python2 rsync xz-utils

      - name: Verify kernel source
        run: |
          test -f Makefile
          grep -m1 '^SUBLEVEL' Makefile
          test -d arch/arm64/boot/dts/qcom

      - name: Fetch AOSP GCC 4.9 (aarch64)
        run: |
          git clone --depth 1 -b cm-14.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            /tmp/gcc49
          /tmp/gcc49/bin/aarch64-linux-android-gcc --version | head -1

      - name: Build kernel
        shell: bash
        run: |
          set -o pipefail
          export ARCH=arm64
          export CROSS_COMPILE=/tmp/gcc49/bin/aarch64-linux-android-
          # 3.10's gcc-wrapper.py is Python 2.
          mkdir -p /tmp/py2
          ln -sf "$(command -v python2)" /tmp/py2/python
          export PATH=/tmp/py2:$PATH
          python --version
          mkdir -p out
          make O=out msm8994_defconfig 2>&1 | tee build.log
          make O=out -j"$(nproc)" 2>&1 | tee -a build.log

      - name: List outputs
        if: always()
        run: |
          find out/arch/arm64/boot -maxdepth 4 -type f \
            \( -name 'Image*' -o -name '*.dtb' \) -printf '%s %p\n' | sort -nr | head -50

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2015-kernel-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dts/**/*.dtb
            out/System.map
            build.log
